[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scifig-mcp"
version = "0.1.0"
description = "MCP server for 学术论文拆解→可编辑科研图(SVG/PPTX/PDF/PNG/EMF)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.31",
    "lxml>=4.9",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
parse = ["pdfplumber>=0.10", "pymupdf>=1.24", "python-docx>=1.1"]
render = ["python-pptx>=0.6.23", "cairosvg>=2.7", "pillow>=10"]
mineru = ["mineru"]
all = [
    "pdfplumber>=0.10",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "cairosvg>=2.7",
    "pillow>=10",
    "mineru",
]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/scifig_mcp"]
